name: "🧪 Tests & Quality with UV"

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'

# Cancel previous runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
  QT_QPA_PLATFORM: offscreen
  UV_PYTHON: python3.10

jobs:
  # Quality checks - linting and formatting
  quality-check:
    name: "🔍 Quality Check"
    runs-on: ubuntu-latest
    steps:
    - name: "📥 Checkout repository"
      uses: actions/checkout@v4

    - name: "⚡ Install UV"
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        export PATH="$HOME/.cargo/bin:$PATH"

    - name: "🐍 Set up Python"
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        uv python install 3.10

    - name: "📦 Install dependencies"
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        uv sync --all-groups

    - name: "🦀 Ruff linting"
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        echo "🦀 Running Ruff linter..."
        uv run ruff check src/ tests/ --fix

    - name: "⚫ Black formatting"
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        echo "⚫ Checking Black formatting..."
        uv run black --check src/ tests/

    - name: "📊 Import sorting"
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        echo "📊 Checking import sorting with Ruff..."
        uv run ruff check --select I src/ tests/

  # Unit tests with matrix strategy
  test:
    name: "🧪 Unit Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: [quality-check]
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - name: "📥 Checkout repository"
      uses: actions/checkout@v4

    - name: "⚡ Install UV"
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        export PATH="$HOME/.cargo/bin:$PATH"

    - name: "🐍 Set up Python ${{ matrix.python-version }}"
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        uv python install ${{ matrix.python-version }}

    - name: "📦 Install dependencies"
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        uv sync --all-groups
      env:
        UV_PYTHON: ${{ matrix.python-version }}

    - name: "🧪 Run unit tests with coverage"
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        echo "🧪 Running tests with coverage..."
        uv run coverage run --source=src/notebooklm_mcp -m pytest tests/ --junitxml=junit-${{ matrix.python-version }}.xml -v
        uv run coverage xml -o coverage-${{ matrix.python-version }}.xml
        echo "✅ Tests completed for Python ${{ matrix.python-version }}"
      env:
        QT_QPA_PLATFORM: offscreen
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1

    - name: "📊 Upload coverage"
      if: matrix.python-version == '3.10'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage-${{ matrix.python-version }}.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
      continue-on-error: true

  # Build check
  build:
    name: "🏗️ Build Package"
    runs-on: ubuntu-latest
    needs: [quality-check]
    steps:
    - name: "📥 Checkout repository"
      uses: actions/checkout@v4

    - name: "⚡ Install UV"
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        export PATH="$HOME/.cargo/bin:$PATH"

    - name: "🐍 Set up Python"
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        uv python install 3.10

    - name: "📦 Install dependencies"
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        uv sync --all-groups

    - name: "🏗️ Build package"
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        echo "🏗️ Building package..."
        uv build
        echo "✅ Package built successfully"

    - name: "✅ Check package"
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        echo "✅ Checking package quality..."
        uv run twine check dist/*
        echo "✅ Package validation completed"